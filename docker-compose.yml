services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1
    container_name: stroke-mlflow
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --allowed-hosts
      - "*"
      - --cors-allowed-origins
      - "*"
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
    ports:
      - "5002:5000"
    volumes:
      - mlflow-data:/mlflow

  api:
    build: .
    container_name: stroke-api
    depends_on:
      - mlflow
    environment:
      CHAMPION_PATH: /app/reports/champion.json
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: stroke-prediction-compose
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/app/reports:ro

volumes:
  mlflow-data:
